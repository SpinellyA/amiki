<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amiki</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0E1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Plain name on purpose: the server's static-asset map points it at the current hashed file.
         The build-time #[.{fingerprint}] placeholder isn't filled in when the API hosts the app. -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Firefox won't start an HTML5 drag unless dataTransfer has data; Blazor can't set it.
        document.addEventListener('dragstart', e => e.dataTransfer?.setData('text/plain', ''));

        window.amiki = {
            // Tells .NET when the tab comes back into view, so data captured elsewhere shows up.
            onTabVisible(dotnet, method) {
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') dotnet.invokeMethodAsync(method);
                });
            },
            // Removes the on-device copy of your data (used when signing out).
            clearCache() {
                Object.keys(localStorage).filter(k => k.startsWith('amiki.cache')).forEach(k => localStorage.removeItem(k));
            },
            // Pomodoro "time's up": three soft notes, rising ("up") or falling ("down"). Made with
            // Web Audio, so there's no sound file to download or cache.
            // Browsers only allow sound that follows a click, so the Start button calls this first.
            unlockAudio() {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                this._audio ??= new Ctx();
                if (this._audio.state === 'suspended') this._audio.resume();
            },
            chime(direction) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = this._audio ??= new Ctx();
                if (ctx.state === 'suspended') ctx.resume();
                const notes = direction === 'up' ? [523.25, 659.25, 783.99] : [783.99, 659.25, 523.25];
                notes.forEach((freq, i) => {
                    const start = ctx.currentTime + i * 0.22;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, start);
                    gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.65);
                });
            },
        };

        // Makes Amiki installable and able to open offline. Some embedded browsers don't allow
        // service workers; the app still works there, just online-only.
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => { });
    </script>
</body>

</html>
